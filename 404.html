<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page introuvable TOMASTEED</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles/main.css"/>
<link rel="stylesheet" href="styles/animations.css"/>
<style>
body { background: var(--black-deep); }
.error-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
}
.error-inner { max-width: 520px; }
.error-code {
  font-family: var(--font-serif);
  font-size: clamp(6rem, 15vw, 10rem);
  font-weight: 300;
  color: rgba(200,168,130,.12);
  line-height: 1;
  margin-bottom: 0;
  letter-spacing: -.02em;
}
.error-logo {
  display: block;
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--white);
  margin-bottom: 40px;
}
.error-logo span { color: var(--red); }
.error-inner h1 {
  font-family: var(--font-serif);
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 300;
  color: var(--white);
  margin-bottom: 16px;
  line-height: 1.2;
}
.error-inner h1 em { font-style: italic; color: var(--gold); }
.error-inner p {
  color: var(--grey-light);
  line-height: 1.8;
  margin-bottom: 40px;
  font-size: .95rem;
}
.error-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}
.divider-404 {
  width: 40px;
  height: 1px;
  background: var(--gold);
  margin: 24px auto;
  opacity: .5;
}
</style>
</head>
<body>
<div class="error-page">
  <div class="error-inner">
    <a href="index.html" class="error-logo">TOMAS<span>TEED</span></a>
    <div class="error-code">404</div>
    <div class="divider-404"></div>
    <h1>Page <em>introuvable</em></h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée. Revenez à l'accueil ou explorez nos pages principales.</p>
    <div class="error-nav">
      <a href="index.html" class="btn btn-primary">
        Retour à l'accueil
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
      <a href="contact.html" class="btn btn-outline">Nous contacter</a>
    </div>
  </div>
</div>
</body>
</html>
